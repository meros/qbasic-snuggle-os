name: Deploy

# The page (original and modern Snuggle OS, with the chat server) as a container
# on Cloud Run, project meros-apps.
#   pull request                    check and build the image only
#   push to master, or run by hand  check, then build, push and deploy
# The service, its deploy account and the keyless login are defined in meros/hosting.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check and build the image
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check
        run: nix flake check --print-build-logs
      - name: Build the image
        run: nix build .#web-image --no-link

  deploy:
    needs: check
    if: github.repository == 'meros/qbasic-snuggle-os' && github.event_name != 'pull_request'
    uses: meros/deploy-workflows/.github/workflows/deploy-cloud-run.yml@main
    with:
      app: snuggleos
      nix_attr: .#web-image
      nix_image: snuggleos:latest
    permissions:
      contents: read
      id-token: write
