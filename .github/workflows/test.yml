name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Pixel tests in DOSBox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install DOSBox and a virtual X server
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dosbox xvfb python3 unzip

      - name: Run the tests
        run: scripts/test.sh

      - name: Keep the dumps of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            build/RESULT.TXT
            build/diff_*.png
